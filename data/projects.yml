- title: "RNN Analysis on Same-Different Task"
  year: "2024"
  note: "Research Project under supervision of [Dr. Xiangbin Teng](https://www.psy.cuhk.edu.hk/index.php/component/sppagebuilder/?view=page&id=558)"
  description: "Trained RNNs on the same-different task under varying noise levels by neurogym, optimizing the code for readability and extensibility. Analyzed normalized averages and principal components of RNN hidden states, performed linear fitting of activities at different time points to stimuli values, and analyzed the temporal scope."
  badges:
    - image: "https://img.shields.io/badge/PyTorch-ee4c2c?logo=pytorch&logoColor=white"
    - image: "https://img.shields.io/badge/NumPy-4DABCF?logo=numpy&logoColor=fff"

